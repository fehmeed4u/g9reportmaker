<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>G9 Chemistry End of Year Report Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F4EE;
    --bg-warm: #EEEBE0;
    --panel: #FFFFFF;
    --ink: #1c1c1a;
    --ink-soft: #4a4a46;
    --ink-mute: #8a8a82;
    --line: #E4E1D5;
    --line-soft: #ECE9DD;
    --accent: #1F5F50;
    --accent-deep: #143E34;
    --accent-soft: #E4EEE9;
    --danger: #b91c1c;
    --warn: #b45309;
    --shadow: 0 1px 0 rgba(20,20,18,0.04), 0 1px 2px rgba(20,20,18,0.04);
    --shadow-lg: 0 1px 0 rgba(20,20,18,0.04), 0 8px 24px -8px rgba(20,20,18,0.12);
    --radius: 8px;
    --radius-sm: 5px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--accent-soft); color: var(--accent-deep); }

  /* ─── Topbar ──────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(245,244,238,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 10px 22px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-family: 'Instrument Serif', serif;
    font-size: 18px; font-style: italic;
    line-height: 1;
    box-shadow: inset 0 -8px 16px rgba(0,0,0,0.12);
  }
  .brand {
    display: flex; flex-direction: column; line-height: 1.1;
  }
  .brand .name {
    font-family: 'Instrument Serif', serif;
    font-size: 19px;
    letter-spacing: -0.005em;
  }
  .brand .sub {
    font-size: 10.5px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .topbar-spacer { flex: 1; }
  .saved-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px;
    color: var(--ink-soft);
    padding: 4px 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .saved-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }
  .saved-pill b { color: var(--ink); font-weight: 600; }

  /* ─── Buttons ─────────────────────────────────────────────── */
  .btn {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
    font-family: inherit; font-size: 12.5px;
    font-weight: 500;
    padding: 6px 12px; border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, border-color .12s, color .12s;
    line-height: 1;
  }
  .btn:hover { border-color: #cdc8b8; background: #fafaf5; }
  .btn:active { transform: translateY(0.5px); }
  .btn.primary {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
  }
  .btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: #fef2f2; border-color: #fecaca; }
  .btn.sm { font-size: 11.5px; padding: 4px 9px; }
  .btn svg { width: 13px; height: 13px; }

  /* ─── Layout ──────────────────────────────────────────────── */
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 18px 22px 60px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .card-hd {
    display: flex; align-items: baseline; gap: 12px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line-soft);
  }
  .card-hd h2 {
    margin: 0;
    font-family: 'Instrument Serif', serif;
    font-size: 19px;
    font-weight: 400;
    letter-spacing: -0.005em;
  }
  .card-hd .hint {
    font-size: 11px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .card-bd { padding: 14px 16px; }

  /* ─── Form rows ───────────────────────────────────────────── */
  .row1 {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 18px;
    margin-bottom: 14px;
  }

  .field-label {
    display: block;
    font-size: 10.5px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
    margin-bottom: 5px;
  }

  .input, .textarea, .select {
    width: 100%;
    background: #FCFBF6;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    padding: 7px 10px;
    transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .input:focus, .textarea:focus, .select:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(31,95,80,0.10);
  }
  .textarea { resize: vertical; min-height: 90px; line-height: 1.5; font-size: 13.5px; }
  .select { padding-right: 26px; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%23666' fill='none' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 9px center;
  }

  /* Pronoun chips */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    appearance: none; border: 1px solid var(--line);
    background: #FCFBF6; color: var(--ink-soft);
    font-family: inherit; font-size: 12px; font-weight: 500;
    padding: 6px 12px; border-radius: 999px;
    cursor: pointer;
    transition: all .12s;
    line-height: 1;
  }
  .chip:hover { border-color: #cdc8b8; }
  .chip[data-on="true"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ─── Two-column form body ───────────────────────────────── */
  .row2 {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 22px;
  }
  .col-divider {
    border-left: 1px solid var(--line-soft);
    padding-left: 22px;
  }

  /* Levels matrix */
  .matrix {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .matrix-row {
    display: grid;
    grid-template-columns: 130px 1fr;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .cat-cell {
    display: flex; flex-direction: column;
    gap: 1px;
    line-height: 1.15;
  }
  .cat-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .cat-blurb {
    font-size: 10.5px;
    color: var(--ink-mute);
    font-weight: 400;
  }
  .level-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }
  .lvl {
    appearance: none;
    border: 1px solid var(--line);
    background: #FCFBF6;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 4px;
    border-radius: 5px;
    cursor: pointer;
    line-height: 1;
    transition: all .12s;
    position: relative;
  }
  .lvl:hover { border-color: #cdc8b8; }
  .lvl[data-on="true"] {
    color: var(--lvl-ink);
    background: var(--lvl-soft);
    border-color: var(--lvl-tint);
    font-weight: 600;
  }
  .lvl[data-on="true"]::before {
    content: ""; position: absolute;
    left: 6px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--lvl-tint);
  }

  /* Targets stack */
  .targets-stack {
    display: flex; flex-direction: column; gap: 10px;
  }
  .target-slot {
    display: flex; align-items: center; gap: 8px;
  }
  .target-slot .num {
    width: 22px; height: 22px;
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-size: 11px; font-weight: 600;
    border-radius: 5px;
    display: grid; place-items: center;
    flex: 0 0 auto;
    font-family: 'JetBrains Mono', monospace;
  }
  .target-slot .num.optional {
    background: #f5f3eb; color: var(--ink-mute);
  }
  .target-slot .select { font-size: 12.5px; padding: 6px 26px 6px 10px; }

  .generate-row {
    margin-top: 14px;
    display: flex; gap: 8px; align-items: center;
  }
  .generate-row .btn { padding: 8px 16px; font-size: 13px; font-weight: 600; }

  .status-line {
    flex: 1;
    font-size: 11.5px;
    color: var(--ink-mute);
  }
  .status-line .ok { color: var(--accent); }
  .status-line .warn { color: var(--warn); }

  /* ─── Output panel ────────────────────────────────────────── */
  .output-card { margin-top: 16px; }
  .output-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 18px;
  }
  .comment-wrap { position: relative; }
  .char-counter {
    position: absolute; right: 8px; bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-mute);
    background: rgba(252,251,246,0.92);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .char-counter.over { color: var(--danger); font-weight: 600; }

  .target-out {
    display: flex; flex-direction: column; gap: 8px;
    padding: 8px 10px;
    background: #FCFBF6;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .target-out + .target-out { margin-top: 8px; }
  .target-out-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 10.5px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .target-tag {
    background: var(--accent-soft);
    color: var(--accent-deep);
    padding: 2px 7px;
    border-radius: 3px;
    font-size: 10px;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 600;
  }
  .target-out .textarea {
    min-height: 44px;
    background: #fff;
    font-size: 12.5px;
    padding: 6px 8px;
    resize: none;
  }

  .save-row {
    margin-top: 12px;
    display: flex; gap: 8px; align-items: center;
    justify-content: flex-end;
  }

  /* ─── Roster ─────────────────────────────────────────────── */
  .roster-card { margin-top: 16px; }
  .roster-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .roster-table th {
    text-align: left;
    font-size: 10.5px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    background: #FAF8F0;
  }
  .roster-table td {
    padding: 10px;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: top;
  }
  .roster-table tr:last-child td { border-bottom: none; }
  .roster-table .name-cell { min-width: 110px; }
  .roster-table .name-cell .nm { font-weight: 600; }
  .roster-table .name-cell .pn {
    font-size: 10.5px; color: var(--ink-mute);
    margin-top: 1px;
  }
  .roster-table .cmt-cell {
    color: var(--ink-soft);
    font-size: 12px;
    line-height: 1.5;
    max-width: 360px;
  }
  .roster-table .tgt-cell {
    font-size: 11.5px;
    color: var(--ink-soft);
    max-width: 180px;
  }
  .tgt-tag-mini {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent-deep);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 9.5px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .row-actions {
    display: flex; gap: 4px; justify-content: flex-end;
  }
  .icon-btn {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .icon-btn:hover { background: #fafaf5; border-color: #cdc8b8; color: var(--ink); }
  .icon-btn.danger:hover { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
  .icon-btn svg { width: 13px; height: 13px; }

  .roster-empty {
    padding: 28px 20px;
    text-align: center;
    color: var(--ink-mute);
    font-size: 12.5px;
  }
  .roster-empty .ic {
    width: 36px; height: 36px;
    margin: 0 auto 8px;
    border-radius: 8px;
    background: var(--bg-warm);
    display: grid; place-items: center;
    color: var(--accent);
  }

  /* Editing banner */
  .editing-banner {
    display: flex; align-items: center; gap: 8px;
    background: #FFF7E6;
    border: 1px solid #F5D88B;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 11.5px;
    color: #6B4A00;
    margin-bottom: 12px;
  }
  .editing-banner .dot {
    width: 6px; height: 6px; background: #B8860B; border-radius: 50%;
  }

  /* Tooltip on level button */
  .lvl[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 4px);
    left: 50%; transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    font-size: 10.5px;
    padding: 3px 7px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 5;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  /* Loading spinner */
  .spin {
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tiny utility */
  .muted { color: var(--ink-mute); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .divider-h { height: 1px; background: var(--line-soft); margin: 12px 0; }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="comments.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
